name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends
            git zip unzip openjdk-17-jdk python3
            autoconf libtool pkg-config zlib1g-dev
            libncurses5-dev libncursesw5-dev libtinfo5
            libssl-dev libreadline-dev libffi-dev

      - name: Install Cython + Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.37
          python -m pip install buildozer

      - name: Build APK (debug)
        id: build
        run: |
          set -o pipefail
          python -m buildozer -v android debug 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Show build log on failure
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build_output.log 2>/dev/null || echo "No build log found"

      - name: Show APK directory
        if: always()
        run: ls -la bin/ 2>/dev/null || echo "No bin/ directory"

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: bouncing-ball-simulator-apk
          path: bin/*.apk
